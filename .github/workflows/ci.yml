name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: chmod +x mvnw

      # Builds every module's jar, including puerto-rico-web's, which is what Playwright's
      # webServer boots. Tests are skipped here — the `build` job above is what verifies them;
      # this job exists to verify the packaged app actually works end-to-end in a browser.
      - run: ./mvnw -B -DskipTests package

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: puerto-rico-frontend/package-lock.json

      - working-directory: puerto-rico-frontend
        run: npm ci

      - working-directory: puerto-rico-frontend
        run: npx playwright install --with-deps chromium

      - working-directory: puerto-rico-frontend
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: puerto-rico-frontend/playwright-report/
          retention-days: 14
